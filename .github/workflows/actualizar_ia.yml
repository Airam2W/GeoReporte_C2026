name: Actualización Automática de Modelos IA

on:
  schedule:
    - cron: '0 0 1 * *' # Se ejecuta el primer día de cada mes a la medianoche UTC
  workflow_dispatch:     # Permite dispararlo manualmente desde la pestaña "Actions" en GitHub

# Permisos requeridos para que GitHub Actions pueda hacer commit y push en tu repo
permissions:
  contents: write

jobs:
  entrenar-y-actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics supabase requests

      - name: Ejecutar Script de Actualización
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/actualizar_modelos.py

      - name: Guardar y sincronizar cambios en el Repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Añadir los modelos actualizados en la ruta exacta
          git add backend/AI/models/
          
          # Verificar si hay cambios reales para commitear
          git diff --staged --quiet || (git commit -m "🤖 Actualización automática mensual de modelos YOLO y ONNX" && git push)